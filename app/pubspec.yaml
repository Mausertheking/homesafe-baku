name: homesafe
description: "HomeSafe Baku: home safety checks, evidence log and rights. TODO(team): final app name."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  firebase_analytics: ^13.0.0
  firebase_app_check: ^0.5.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  firebase_storage: ^14.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config/
    - assets/rules/
    - assets/l10n/
    - assets/legal/
  # Noto Sans (SIL OFL, see assets/fonts/OFL.txt): full Azerbaijani + Cyrillic,
  # bundled so text looks the same on every phone and works offline.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-ExtraBold.ttf
          weight: 800
