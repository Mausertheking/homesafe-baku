name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tool/check_secrets.sh --all

  app:
    name: Flutter app (analyze + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Cloud Functions (types + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run

  emulators:
    name: Security rules + emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npm ci --prefix security-tests
      - run: npm run build --prefix functions
      # The emulator needs SOME value for the secret; it is never a real key.
      - run: printf 'GEMINI_API_KEY=ci-dummy-not-a-key\n' > functions/.secret.local
      - name: Firestore/Storage rules + end-to-end evidence hashing
        run: security-tests/node_modules/.bin/firebase emulators:exec --project demo-homesafe --only auth,firestore,storage,functions "npm --prefix security-tests run test:run"
      - name: askHomeSafe + account deletion on the Firestore emulator
        run: security-tests/node_modules/.bin/firebase emulators:exec --project demo-homesafe --only firestore "npm --prefix functions test"
